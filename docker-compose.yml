services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - landscape_data:/data
    environment:
      # Set IMAGE_EDIT_API_KEY (a Google Gemini API key) to enable real
      # image generation; without it the API runs fully otherwise, and
      # render requests fail cleanly per season instead of generating.
      IMAGE_EDIT_API_KEY: ${IMAGE_EDIT_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-image}
    restart: unless-stopped

volumes:
  landscape_data:
